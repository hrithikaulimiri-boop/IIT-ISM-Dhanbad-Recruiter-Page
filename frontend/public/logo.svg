<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular outer gear boundary -->
  <circle cx="200" cy="200" r="180" stroke="#0033cc" stroke-width="2" />
  
  <!-- Gear teeth (Simplified but recognizable) -->
  <g stroke="#0033cc" stroke-width="3">
    <path d="M200 10 L200 30 M200 370 L200 390 M10 200 L30 200 M370 200 L390 200" />
    <path d="M65.7 65.7 L79.8 79.8 M320.2 320.2 L334.3 334.3 M65.7 334.3 L79.8 320.2 M320.2 65.7 L334.3 79.8" />
  </g>

  <!-- Text Rings -->
  <circle cx="200" cy="200" r="150" stroke="#0033cc" stroke-width="1" />
  <circle cx="200" cy="200" r="120" stroke="#0033cc" stroke-width="1" />
  
  <!-- Outer Ring Text (English) -->
  <defs>
    <path id="outerPath" d="M200 350 A150 150 0 1 1 200.1 350" />
    <path id="innerPath" d="M200 320 A120 120 0 1 1 200.1 320" />
  </defs>
  
  <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0033cc">
    <textPath href="#outerPath" startOffset="0%">
      INDIAN INSTITUTE OF TECHNOLOGY (INDIAN SCHOOL OF MINES) DHANBAD
    </textPath>
  </text>
  
  <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0033cc">
    <textPath href="#innerPath" startOffset="0%">
      भारतीय खनि विद्यापीठ धनबाद
    </textPath>
  </text>

  <!-- Central Blue Hub -->
  <circle cx="200" cy="200" r="70" fill="#0033cc" />
  
  <!-- White symbols (Simplified Lotus/Book) -->
  <path d="M200 160 Q220 180 200 210 Q180 180 200 160" fill="white" />
  <rect x="180" y="215" width="40" height="15" fill="white" />
  
  <!-- 1926 and Stars -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0033cc">★ 1926 ★</text>
  
  <!-- Bottom Motto Banner -->
  <path d="M50 390 Q200 450 350 390" stroke="#0033cc" stroke-width="3" fill="none" />
  <text x="200" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0033cc">
    उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत
  </text>
</svg>
